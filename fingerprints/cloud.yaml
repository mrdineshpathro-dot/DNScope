      - type: asn
        value: "AS8075"
        confidence: high
        evidence: "IP belongs to AS8075 (MICROSOFT-CORP-MSN-AS-BLOCK)"
      - type: organization
        value: "microsoft azure"
        confidence: medium
        evidence: "IP registry organization mentions Azure"

