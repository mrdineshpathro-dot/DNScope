# DNScope cloud / hosting provider fingerprints.
#
# Every match records the evidence that produced it, and the confidence reflects
# how specific the signal is:
#   high   - the hostname can only belong to this provider
#   medium - the pattern is strongly associated but shared
#   low    - heuristic; used only when nothing better matches
#
# Matches are evaluated in file order; the first match with the highest
# confidence wins.

version: 4
providers:
  - name: amazon-web-services
    display_name: Amazon Web Services
    category: cloud
    homepage: https://aws.amazon.com
    patterns:
      - type: cname
        value: ".amazonaws.com"
        confidence: high
        evidence: "CNAME into amazonaws.com"
      - type: cname
        value: ".awsdns-"
        confidence: high
        evidence: "CNAME into awsdns zone"
      - type: cname
        value: ".elb.amazonaws.com"
        confidence: high
        evidence: "CNAME into an Elastic Load Balancer"
      - type: cname
        value: ".cloudfront.net"
        confidence: high
        evidence: "CNAME into Amazon CloudFront"
        category: cdn
      - type: cname
        value: ".elasticbeanstalk.com"
        confidence: high
        evidence: "CNAME into Elastic Beanstalk"
      - type: ptr
        value: ".compute.amazonaws.com"
        confidence: high
        evidence: "reverse DNS in the EC2 compute zone"
      - type: ptr
        value: ".compute-1.amazonaws.com"
        confidence: high
        evidence: "reverse DNS in the EC2 us-east-1 zone"
      - type: asn
        value: "AS16509"
        confidence: high
        evidence: "IP belongs to AS16509 (AMAZON-02)"
      - type: asn
        value: "AS14618"
        confidence: high
        evidence: "IP belongs to AS14618 (AMAZON-AES)"
      - type: organization
        value: "amazon"
        confidence: medium
        evidence: "IP registry organization mentions Amazon"

